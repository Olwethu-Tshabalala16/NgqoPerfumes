name: Django checks

on:
  push:
    branches:
      - main
      - "fix/**"
      - "refactor/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: nqoperfumes/myshop
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "True"
        run: python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Vercel frontend build command and deployment configuration
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "True"
        run: |
          python scripts/build_vercel.py
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          json.loads(pathlib.Path("vercel.json").read_text())
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["tool"]["vercel"]["entrypoint"] == "vercel_wsgi:application"
          assert data["project"]["requires-python"] == ">=3.13,<3.14"

          pyproject_dependencies = data["project"]["dependencies"]
          requirements_dependencies = [
              line.strip()
              for line in pathlib.Path("requirements.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert pyproject_dependencies == requirements_dependencies, (
              "pyproject.toml dependencies must match requirements.txt exactly"
          )
          PY

      - name: Verify Django and customer static assets are collected
        working-directory: nqoperfumes/myshop
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "True"
        run: |
          python manage.py collectstatic --noinput
          test -f staticfiles/admin/css/base.css
          test -f staticfiles/admin/nqo-admin.css
          test -f staticfiles/styles.css
          test -f staticfiles/app.js
          test -f staticfiles/config.js

      - name: Check frontend and Python syntax
        run: |
          node --check frontend/app.js
          node --check frontend/config.js
          python -m py_compile manage.py vercel_wsgi.py scripts/build_vercel.py
          python -m py_compile nqoperfumes/myshop/myshop/wsgi.py nqoperfumes/myshop/store/middleware.py

      - name: Run automated tests
        working-directory: nqoperfumes/myshop
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "True"
        run: python manage.py test

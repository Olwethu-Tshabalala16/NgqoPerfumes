name: NgqoPerfumes CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python test and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Django system checks
        working-directory: nqoperfumes/myshop
        run: python manage.py check

      - name: Validate Vercel frontend build command and deployment configuration
        run: |
          python scripts/build_vercel.py
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          json.loads(pathlib.Path("vercel.json").read_text())
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["tool"]["vercel"]["entrypoint"] == "vercel_wsgi:application"
          assert data["project"]["requires-python"] == ">=3.13,<3.14"

          pyproject_dependencies = data["project"]["dependencies"]
          requirements_dependencies = [
              line.strip()
              for line in pathlib.Path("requirements.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert pyproject_dependencies == requirements_dependencies, (
              "pyproject.toml dependencies must match requirements.txt exactly"
          )
          PY

      - name: Collect and verify static assets
        working-directory: nqoperfumes/myshop
        run: |
          python manage.py collectstatic --noinput
          test -f staticfiles/admin/css/base.css
          test -f staticfiles/admin/nqo-admin.css
          test -f staticfiles/admin/password-toggle.js
          test -f staticfiles/styles.css
          test -f staticfiles/app.js
          test -f staticfiles/config.js
          test -f staticfiles/catalogue-utils.js

      - name: Run frontend unit tests
        run: node --test frontend/tests/*.test.js

      - name: Check frontend and Python syntax
        run: |
          node --check frontend/app.js
          node --check frontend/config.js
          node --check frontend/catalogue-utils.js
          node --check frontend/theme.js
          node --check nqoperfumes/myshop/store/static/admin/password-toggle.js
          python -m py_compile manage.py vercel_wsgi.py scripts/build_vercel.py
          python -m py_compile nqoperfumes/myshop/myshop/wsgi.py nqoperfumes/myshop/store/middleware.py

      - name: Run Django tests and generate coverage report
        working-directory: nqoperfumes/myshop
        run: |
          coverage run --rcfile=../../.coveragerc manage.py test
          coverage report --rcfile=../../.coveragerc --fail-under=70
          coverage xml --rcfile=../../.coveragerc -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: django-coverage-report
          path: nqoperfumes/myshop/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run Django live-server browser end-to-end tests
        working-directory: nqoperfumes/myshop
        run: python manage.py test tests.e2e --verbosity=2


  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Run Bandit Python security analysis
        run: bandit -q -r nqoperfumes/myshop/store -ll

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

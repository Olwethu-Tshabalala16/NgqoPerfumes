[tool.vercel]
# Native Vercel Django deployment. The manage.py file lives under
# nqoperfumes/myshop/, and this is the project's WSGI callable.
entrypoint = "nqoperfumes/myshop/myshop/wsgi.py:application"

[tool.vercel.scripts]
# Generate only the public frontend configuration here. Vercel's Django
# integration runs collectstatic and serves the collected assets via its CDN.
build = "python scripts/build_vercel.py"

{% extends "admin/base.html" %}
{% block extrastyle %}
{{ block.super }}
<style>
:root,html[data-theme="light"]{--primary:#C9A96E;--secondary:#2C2A2A;--link-fg:#8F713B;--link-selected-fg:#6F552A;--header-color:#2C2A2A;--header-branding-color:#2C2A2A;--body-fg:#2C2A2A;--body-bg:#FDFBF7;--darkened-bg:#F7F0E6;--selected-row:#FFF9EF;--hairline-color:#F0E8D8;--border-color:#D9D0C2;--button-bg:#2C2A2A;--button-hover-bg:#474343;--nqo-surface:#FFFFFF;--nqo-input:#FFFFFF;--nqo-muted:#6B5E4E;--nqo-shadow:rgba(201,169,110,.14);--nqo-guide:#FFF9EF}
html[data-theme="dark"]{--primary:#D8B978;--secondary:#F4EFE6;--link-fg:#E2C58D;--link-selected-fg:#F0D9A9;--header-color:#F4EFE6;--header-branding-color:#F4EFE6;--body-fg:#F1ECE3;--body-bg:#171615;--darkened-bg:#24211D;--selected-row:#2C271F;--hairline-color:#3A352E;--border-color:#51493D;--button-bg:#D8B978;--button-hover-bg:#E6CC98;--nqo-surface:#211F1C;--nqo-input:#181715;--nqo-muted:#C5B9A8;--nqo-shadow:rgba(0,0,0,.30);--nqo-guide:#28231C}
html,body{background:var(--body-bg)!important;color:var(--body-fg);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif}#header{background:linear-gradient(135deg,var(--primary),var(--darkened-bg))!important;color:var(--header-color)!important;box-shadow:0 2px 12px var(--nqo-shadow);border-bottom:1px solid var(--primary)}#branding h1,#branding h1 a,#user-tools,#user-tools a{color:var(--header-branding-color)!important}#branding h1{font-weight:700;letter-spacing:2px}
#content{max-width:1440px;margin:0 auto;padding:28px}.module,#content-related .module,.submit-row{background:var(--nqo-surface);border:1px solid var(--hairline-color);border-radius:14px;box-shadow:0 4px 12px var(--nqo-shadow);overflow:hidden}.module caption,.module h2,.module h3,#content-related h2{background:var(--darkened-bg);color:var(--body-fg);border-bottom:1px solid var(--hairline-color)}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=url],textarea,select{border:1px solid var(--border-color);border-radius:8px;background:var(--nqo-input);color:var(--body-fg)}input:focus,textarea:focus,select:focus{border-color:var(--primary)!important;outline:3px solid rgba(201,169,110,.18)!important}.button,input[type=submit],input[type=button],.submit-row input,a.button{border-radius:9px;font-weight:600}.button.default,input[type=submit].default,.submit-row input.default{background:var(--button-bg);border-color:var(--button-bg);color:var(--body-bg)}.button.default:hover,input[type=submit].default:hover,.submit-row input.default:hover{background:var(--button-hover-bg)}a:link,a:visited{color:var(--link-fg)}a:hover{color:var(--link-selected-fg)}
#changelist,#changelist-filter{background:var(--nqo-surface);border-color:var(--hairline-color)}#changelist table thead th{background:var(--darkened-bg);color:var(--body-fg)}#changelist table tbody tr:hover{background:var(--selected-row)}
body.login #container{background:var(--body-bg)}body.login #content{padding:40px 20px 60px}body.login #content-main{max-width:520px;margin:0 auto}body.login #login-form{background:var(--nqo-surface);border:1px solid var(--hairline-color);border-radius:16px;padding:24px;box-shadow:0 8px 26px var(--nqo-shadow)}body.login #login-form .form-row{padding:0 0 18px;border:0}body.login #login-form label{display:block;margin-bottom:7px;color:var(--body-fg);font-weight:600}body.login #login-form input[type=text],body.login #login-form input[type=password]{width:100%;min-height:44px;padding:10px 12px}body.login #login-form .submit-row{box-shadow:none;border:0;padding:12px 0 0;margin:0;background:transparent;text-align:left}body.login #login-form .submit-row input{min-height:42px;padding:10px 20px;background:var(--button-bg);border:1px solid var(--button-bg);color:var(--body-bg);border-radius:9px}body.login #login-form .submit-row input:hover{background:var(--button-hover-bg)}body.login .errornote{border-radius:9px;border:1px solid #B66A6A;background:#FFF5F5;color:#7A3030}
@media(max-width:900px){#content{padding:20px 16px 34px}}@media(max-width:640px){#content{padding:16px 10px 28px}}
</style>
{% endblock %}
